name: API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Executa diariamente às 9h UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Instalar dependências
      run: npm ci
    
    - name: Executar testes da API
      run: npm run test:ci
      continue-on-error: false
    
    - name: Upload dos relatórios
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newman-reports
        path: newman/reports/
        retention-days: 30
    
    - name: Publicar resultados
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('newman/reports/report.json', 'utf8'));
          
          const summary = `
          ## 📊 Resultados dos Testes de API
          
          - ✅ Testes executados: ${report.run.stats.tests.total}
          - ✅ Testes passaram: ${report.run.stats.tests.passed}
          - ❌ Testes falharam: ${report.run.stats.tests.failed}
          - ⏭️ Testes ignorados: ${report.run.stats.tests.skipped}
          - ⏱️ Tempo total: ${report.run.timings.completed - report.run.timings.started}ms
          `;
          
          core.summary.addRaw(summary).write();
